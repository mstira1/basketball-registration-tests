name: Basketball England Registration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [ chrome, firefox ]  # يفي بمتطلب VG لاختبار متصفحين
        java-version: [ '17' ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Set up browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          
      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}  # يمرر المتصفح المحدد إلى الاختبارات
        run: |
          mvn test -Dbrowser=${{ matrix.browser }}
          
      - name: Upload test reports
        if: always()  # يحمل النتائج حتى لو فشلت الاختبارات
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/**
            target/cucumber-reports/**
