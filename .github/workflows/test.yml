name: Kör tester automatiskt

on:
  push:
    branches: [ main ]     # kör varje gång du pushar till main
  pull_request:
    branches: [ main ]     # även när någon gör en pull request

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Klona repot
      uses: actions/checkout@v3

    - name: Installera Java och Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Bygg projektet och kör tester
      run: mvn clean test
